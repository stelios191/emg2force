# New-person recipe: 19 other people, electrode shifts up to 1 electrode, CAR, no input normalisation.
name: final_loso_shift_256
protocol: loso
subjects: eval
mvc_convention: session
label_filter: zero_phase_lowpass_10hz
history: 32
warmup_s: 0.7
input_norm: none  # holds a press (see docs/experiments.md)
filter: {montage: car}  # each grid's mean subtracted
seeds: [0]
save_predictions: true
models:
  tcn: {hidden: 64, dilations: [1, 2, 4, 8, 16], dropout: 0.3, weight_decay: 0.01, steps: 2000, aug_shift: 1.0}
