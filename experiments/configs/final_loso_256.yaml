# First new-person recipe on the 16: 19 other people, running-mean inputs, 256 electrodes. TCN, ridge, constant, zero.
name: final_loso_256
subjects: eval
mvc_convention: session
label_filter: zero_phase_lowpass_10hz
history: 32
warmup_s: 0.7
input_norm: running_mean
seeds: [0]
save_predictions: true
save_models: true
protocol: loso
models:
  zero: {}
  constant: {}
  ridge: {alpha: 10.0}
  tcn: {hidden: 64, kernel: 2, dilations: [1, 2, 4, 8, 16], dropout: 0.3, weight_decay: 0.01, steps: 2000}
